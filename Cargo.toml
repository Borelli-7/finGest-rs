[package]
name = "money-manager-api"
version = "0.1.0"
edition = "2024"
authors = ["Money Manager Team"]
description = "A RESTful API for money management"

[dependencies]
# Core dependencies
actix-web = "4.9"
actix-cors = "0.7"
tokio = { version = "1.48", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "time", "uuid", "bigdecimal", "macros", "json", "migrate", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15.0"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utility crates
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
async-trait = "0.1"
validator = { version = "0.18", features = ["derive"] }
bigdecimal = { version = "0.4", features = ["serde"] }
log = "0.4"
futures = "0.3"
mockall = "0.13"

# Authentication crates
jsonwebtoken = "9.3"
bcrypt = "0.16"

[dev-dependencies]
tokio-test = "0.4"
actix-rt = "2.10"
mockall = "0.13"
fake = { version = "2.10", features = ["derive", "uuid", "chrono"] }

[lib]
name = "money_manager_api"
path = "src/lib.rs"

[[bin]]
name = "money-manager-api"
path = "src/main.rs"
